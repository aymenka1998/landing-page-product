<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>لوحة تحكم المنتج</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e5e7eb;font:16px system-ui,Tahoma,sans-serif}.layout{display:flex;min-height:100vh}.sidebar{width:230px;background:#111827;padding:24px;position:fixed;inset:0 0 0 auto}.sidebar h1{font-size:20px}.sidebar button{display:block;width:100%;text-align:right;margin:8px 0;background:transparent;color:#cbd5e1;border:0;padding:12px;border-radius:8px;cursor:pointer}.sidebar button.active,.sidebar button:hover{background:#312e81;color:white}.main{margin-right:230px;width:calc(100% - 230px);padding:24px;max-width:1200px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:#4f46e5;color:white}.secondary{background:#334155}.publish{background:#059669}.card{background:#111827;border:1px solid #293449;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{color:#a5b4fc;font-size:14px}input,textarea{background:#0b1020;color:white;border:1px solid #334155;border-radius:8px;padding:10px;font:inherit;width:100%}textarea{min-height:80px}.images{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.images img{width:100%;height:150px;object-fit:contain;background:#080b14;border-radius:8px}.notice{color:#94a3b8;font-size:14px}.row{display:flex;gap:10px;align-items:center;margin:10px 0}.toast{position:fixed;bottom:20px;left:20px;padding:14px;background:#047857;border-radius:8px;display:none}.toast.error{background:#b91c1c}.section{display:none}.section.active{display:block}@media(max-width:700px){.sidebar{position:static;width:100%;}.layout{display:block}.sidebar nav{display:flex;overflow:auto}.main{margin:0;width:100%;padding:14px}.grid,.images{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="layout"><aside class="sidebar"><h1>🎛️ لوحة التحكم</h1><p>إدارة صفحة الهبوط</p><nav id="nav"></nav></aside><main class="main"><header class="top"><h2 id="title">المنتج</h2><div class="actions"><button id="save" type="button">💾 حفظ التغييرات</button><button id="publish" class="publish" type="button">🚀 نشر الموقع</button><button id="preview" class="secondary" type="button">👁️ معاينة</button><button id="installApp" class="secondary" type="button" hidden>تثبيت التطبيق</button><button id="logout" class="secondary" type="button">تسجيل الخروج</button></div></header><p class="notice">للمعاينة شغّل npm run dev في مشروع صفحة الهبوط. المعاينة المحلية: http://localhost:3000</p>
<section class="section active" id="product"><div class="card"><h3>بيانات المنتج</h3><div class="grid" id="productFields"></div></div><div class="card"><h3>رسالة الشكر والعرض الإضافي</h3><div class="grid" id="thankFields"></div></div><div class="card"><h3>مميزات المنتج</h3><div id="featuresEditor"></div><button id="addFeature" type="button" class="secondary">+ إضافة ميزة</button></div><div class="card"><h3>الأسئلة الشائعة</h3><div id="faqEditor"></div><button id="addFaq" type="button" class="secondary">+ إضافة سؤال</button></div></section>
<section class="section" id="images"><div class="card"><h3>الصور وأوصافها</h3><div class="images" id="imageFields"></div></div></section>
<section class="section" id="cities"><div class="card"><h3>الولايات (ولاية في كل سطر)</h3><textarea id="citiesField"></textarea></div></section>
<section class="section" id="contact"><div class="card"><h3>التواصل والفوتر</h3><div class="grid" id="contactFields"></div></div></section>
</main></div><div class="toast" id="toast"></div>
<script>
const API='/api';let data={};const slots=[['product-front.jpg','الواجهة الأمامية'],['product-side.jpg','المنظر الجانبي'],['product-back.jpg','الجهة الخلفية'],['product-wrist.jpg','على المعصم']];
const navItems=[['product','📦 المنتج'],['images','🖼️ الصور'],['cities','📍 الولايات'],['contact','📞 التواصل']];
function el(tag,attrs={},text=''){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n}
function field(parent,label,key,value,area=false,type='text',full=false){const wrap=el('div',{class:full?'field full':'field'});wrap.append(el('label',{},label));const input=el(area?'textarea':'input',area?{id:key}:{id:key,type});input.value=value??'';wrap.append(input);parent.append(wrap)}
function notify(message,error=false){const t=document.getElementById('toast');t.textContent=message;t.className='toast'+(error?' error':'');t.style.display='block';setTimeout(()=>t.style.display='none',4000)}
function render(){const p=document.getElementById('productFields');p.replaceChildren();[['اسم المنتج','name'],['النوع','type'],['الشعار','tagline'],['السعر','price'],['السعر السابق','oldPrice'],['العملة','currency'],['أقصى كمية','maxQty'],['نسبة التوفير المحسوبة','savingsPercent']].forEach(([label,key])=>field(p,label,key,key==='savingsPercent'?`${Math.round((1-Number(data.price)/Number(data.oldPrice))*100)}%`:data[key]??'',false,'text'));
['price','oldPrice'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{const old=Number(val('oldPrice')),price=Number(val('price'));document.getElementById('savingsPercent').value=old>0&&price>0?String(Math.round((1-price/old)*100))+'%':''}));
field(p,'شارة العرض (بدون نسبة ثابتة)','badge',data.badge);field(p,'وصف المنتج','description',data.description,true,'text',true);field(p,'نص الضمان','guaranteeText',data.guaranteeText);renderCollection("featuresEditor","features",data.features||[],[["icon","الأيقونة"],["title","عنوان الميزة"],["description","الوصف"]]);renderCollection("faqEditor","faq",data.faq||[],[["question","السؤال"],["answer","الإجابة"]]);
const t=document.getElementById('thankFields');t.replaceChildren();field(t,'رسالة صفحة الشكر','thankMessage',data.thankYou?.message,true,'text',true);const u=data.thankYou?.upsell||{};field(t,'تفعيل العرض الإضافي (true/false)','upsellEnabled',u.enabled);field(t,'عنوان العرض','upsellTitle',u.title);field(t,'وصف العرض','upsellDescription',u.description,true,'text',true);field(t,'السعر السابق','upsellOldPrice',u.oldPrice);field(t,'السعر','upsellPrice',u.price);field(t,'رسالة واتساب للعرض','upsellWhatsappText',u.whatsappText,true,'text',true);
document.getElementById('citiesField').value=(data.cities||[]).join('\n');const im=document.getElementById('imageFields');im.replaceChildren();slots.forEach(([filename,label],i)=>{const box=el('div',{class:'card'});box.append(el('h4',{},label));const image=el('img',{src:`/preview-images/${filename}?v=${Date.now()}`,alt:label});box.append(image);field(box,'العنوان','imgTitle'+i,data.images?.[i]?.title||label);field(box,'الوصف','imgDesc'+i,data.images?.[i]?.desc||'',true);const input=el('input',{type:'file',accept:'image/jpeg,image/png,image/webp'});input.addEventListener('change',()=>upload(input,i));box.append(input);im.append(box)});
const c=document.getElementById('contactFields');c.replaceChildren();field(c,'رقم واتساب','whatsappNumber',data.whatsappNumber);field(c,'البريد الإلكتروني','email',data.email,false,'email');field(c,'البريد بالفوتر','footerEmail',data.footer?.email);field(c,'العلامة التجارية','brand',data.footer?.brand);field(c,'وصف المتجر','footerDescription',data.footer?.description,true,'text',true);field(c,'إنستغرام','instagram',data.footer?.socialLinks?.instagram);field(c,'X / تويتر','twitter',data.footer?.socialLinks?.twitter);field(c,'تيك توك','tiktok',data.footer?.socialLinks?.tiktok);
}
function renderCollection(id,key,items,fields){const box=document.getElementById(id);box.replaceChildren();items.forEach((item,index)=>{const card=el("div",{class:"card"});card.append(el("strong",{},(key==="features"?"الميزة ":"السؤال ")+(index+1)));fields.forEach(([name,label])=>{const wrap=el("div",{class:"field"});wrap.append(el("label",{},label));const input=el(name==="description"||name==="answer"?"textarea":"input",name==="icon"?{type:"text"}:{});input.value=item[name]||"";input.dataset.field=name;wrap.append(input);card.append(wrap)});const remove=el("button",{type:"button",class:"secondary"},"حذف");remove.addEventListener("click",()=>{items.splice(index,1);renderCollection(id,key,items,fields)});card.append(remove);box.append(card)})} function readCollection(id){return [...document.getElementById(id).querySelectorAll(".card")].map(card=>Object.fromEntries([...card.querySelectorAll("[data-field]")].map(input=>[input.dataset.field,input.value])))} function val(id){return document.getElementById(id)?.value??''}
function collect(){data.name=val('name');data.type=val('type');data.tagline=val('tagline');data.price=Number(val('price'));data.oldPrice=Number(val('oldPrice'));data.currency=val('currency');data.maxQty=Number(val('maxQty'));data.badge=val('badge');data.description=val('description');data.guaranteeText=val('guaranteeText');data.email=val('email');data.thankYou={message:val('thankMessage'),upsell:{enabled:val('upsellEnabled')==='true',title:val('upsellTitle'),description:val('upsellDescription'),oldPrice:Number(val('upsellOldPrice')),price:Number(val('upsellPrice')),whatsappText:val('upsellWhatsappText')}};data.cities=val('citiesField').split('\n').map(x=>x.trim()).filter(Boolean);data.features=readCollection("featuresEditor");data.faq=readCollection("faqEditor");data.footer={...(data.footer||{}),brand:val('brand'),description:val('footerDescription'),email:val('footerEmail'),socialLinks:{instagram:val('instagram'),twitter:val('twitter'),tiktok:val('tiktok')}};data.images=(data.images||[]);slots.forEach(([,label],i)=>{data.images[i]={...(data.images[i]||{}),title:val('imgTitle'+i)||label,desc:val('imgDesc'+i)}})}
async function save(){collect();const b=document.getElementById('save');b.disabled=true;b.textContent='جارٍ الحفظ…';try{const r=await fetch(API+'/product',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);notify('تم حفظ التغييرات بنجاح ✅')}catch(e){notify(e.message||'فشل الحفظ',true)}finally{b.disabled=false;b.textContent='💾 حفظ التغييرات'}}
async function upload(input,slot){if(!input.files[0])return;const f=input.files[0];if(f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type)){notify('الصورة يجب أن تكون JPG أو PNG أو WebP وأقل من 5MB',true);return}const fd=new FormData();fd.append('slot',String(slot));fd.append('image',f);try{const r=await fetch(API+'/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.error);data=await (await fetch(API+'/product')).json();render();notify('تم رفع الصورة وحفظ بياناتها ✅')}catch(e){notify(e.message||'فشل رفع الصورة',true)}}
document.getElementById("addFeature").addEventListener("click",()=>renderCollection("featuresEditor","features",[...readCollection("featuresEditor"),{icon:"✨",title:"",description:""}],[ ["icon","الأيقونة"],["title","عنوان الميزة"],["description","الوصف"] ]));document.getElementById("addFaq").addEventListener("click",()=>renderCollection("faqEditor","faq",[...readCollection("faqEditor"),{question:"",answer:""}],[ ["question","السؤال"],["answer","الإجابة"] ]));document.getElementById('save').addEventListener('click',save);document.getElementById('preview').addEventListener('click',()=>window.open('http://localhost:3000','_blank','noopener'));document.getElementById('publish').addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;b.textContent='جارٍ النشر…';try{const r=await fetch(API+'/publish',{method:'POST'});const j=await r.json();if(!r.ok)throw Error(j.error);notify(j.message||'سيظهر التحديث على موقعك خلال 1-2 دقيقة')}catch(err){notify(err.message||'فشل النشر',true)}finally{b.disabled=false;b.textContent='🚀 نشر الموقع'}});
navItems.forEach(([id,label],i)=>{const b=el('button',{type:'button',class:i===0?'active':''},label);b.addEventListener('click',()=>{document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('title').textContent=label});document.getElementById('nav').append(b)});
(async()=>{try{const r=await fetch(API+'/product');if(!r.ok)throw Error();data=await r.json();render()}catch{notify('تعذر تحميل المنتج. تحقق من وجود مشروع صفحة الهبوط.',true)}})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});let installPrompt=null;window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;const b=document.getElementById("installApp");b.hidden=false;b.addEventListener("click",async()=>{installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;b.hidden=true},{once:true})});document.getElementById("logout").addEventListener("click",async()=>{await fetch("/api/auth/logout",{method:"POST"});location.replace("/")});</script></body></html>
