<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>دخول لوحة التحكم</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#312e81,#0b1020 55%);color:#f8fafc;font:16px system-ui,Tahoma,sans-serif;padding:20px}.card{width:min(100%,440px);padding:28px;border:1px solid #334155;border-radius:20px;background:#111827;box-shadow:0 25px 80px #0008}h1{margin-top:0}p{color:#cbd5e1;line-height:1.7}.field{margin:16px 0}label{display:block;color:#c7d2fe;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #475569;border-radius:9px;background:#0b1020;color:white;font:inherit}button{width:100%;padding:12px;border:0;border-radius:9px;background:#4f46e5;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.notice{color:#fbbf24;font-size:14px;min-height:24px}.address{direction:ltr;overflow-wrap:anywhere;color:#a5b4fc;font-size:14px}</style></head><body><main class="card"><h1>🔐 لوحة تحكم المنتج</h1><p id="intro">جارٍ التحقق من إعداد الحساب…</p><form id="authForm"><div class="field"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required minlength="3"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required minlength="12"></div><div class="field" id="setupCodeWrap" hidden><label for="setupCode">رمز الإعداد من نافذة تشغيل الحاسوب</label><input id="setupCode" autocomplete="one-time-code"></div><div class="field" id="confirmWrap" hidden><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" minlength="12"></div><p class="notice" id="message" aria-live="polite"></p><button id="submit" type="submit">تسجيل الدخول</button></form><p class="address" id="localAddress"></p><p>الجلسة تنتهي تلقائياً بعد 8 ساعات. لا تشارك كلمة المرور أو ملفات الشهادة.</p></main><script>
const form=document.getElementById('authForm'),msg=document.getElementById('message'),button=document.getElementById('submit');let setup=false;
(async()=>{try{const r=await fetch('/api/auth/status',{cache:'no-store'}),d=await r.json();if(d.authenticated){location.replace('/');return}setup=!d.configured;document.getElementById('intro').textContent=setup?'أنشئ حساب المسؤول أول مرة. كلمة المرور يجب أن تكون 12 حرفاً على الأقل.':'سجّل الدخول لمتابعة إدارة صفحة المنتج.';document.getElementById('confirmWrap').hidden=!setup;document.getElementById('setupCodeWrap').hidden=!setup;document.getElementById('password').autocomplete=setup?'new-password':'current-password';button.textContent=setup?'إنشاء حساب المسؤول':'تسجيل الدخول';document.getElementById('localAddress').textContent=d.localAddress||''}catch{msg.textContent='تعذر الاتصال بالخادم. تأكد من تشغيل لوحة التحكم.'}})();
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';if(setup&&document.getElementById('password').value!==document.getElementById('confirm').value){msg.textContent='كلمتا المرور غير متطابقتين.';return}button.disabled=true;try{const r=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value,setupCode:document.getElementById('setupCode').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/')}catch(error){msg.textContent=error.message||'تعذر تسجيل الدخول.'}finally{button.disabled=false}});
</script></body></html>
